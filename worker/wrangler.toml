name = "tapapp-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
BQ_DATASET = "tapapp_telemetry"
GCS_AUTHENTICATED_BUCKET = "assignment_submission_tap"
GCS_PUBLIC_BUCKET = "assignment_submission_tap"
AI_PROVIDER_BASE_URL="https://generativelanguage.googleapis.com/v1beta/openai"
AI_PROVIDER_MODEL="models/gemini-3.1-flash-lite"
R2_ACCOUNT_ID="caf21887946d0c74a130ed0b6a752b97"
R2_SUBMISSIONS_BUCKET_NAME = "tap-submissions"
BQ_ENABLED = "false"
BQ_DAILY_BYTE_BUDGET = "10737418240"
BQ_WRITE_TIMEOUT_MS = "8000"
BQ_FLUSH_RETRY_DELAY_MS = "60000"
BQ_MAX_FLUSH_RETRIES = "1"
SESSION_IDLE_TIMEOUT_MS = "900000"
SESSION_MAX_LIFETIME_MS = "3600000"
CHAT_IDLE_TIMEOUT_MS = "900000"
CHAT_MAX_HISTORY_TURNS = "2"
MAX_TAPS_PER_ROW = "200"

[[d1_databases]]
binding = "DB"
database_name = "tapapp-submissions"
database_id = "e7eac427-d994-4f4b-8770-fd3c95b577d0"

[[durable_objects.bindings]]
name = "STUDENT_SESSION"
class_name = "StudentSession"

[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StudentSession", "ChatSession"]

[[analytics_engine_datasets]]
binding = "REQUEST_ANALYTICS"
dataset = "tapapp_requests"